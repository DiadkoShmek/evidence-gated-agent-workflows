name: Ask about an AI workflow
description: Share a public, sanitized question about one AI workflow or handoff.
title: "[inquiry] "
labels: ["client-inquiry", "review-required"]
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Do not include credentials, personal data, customer records, private URLs, proprietary code, or security-sensitive details. A public summary is enough to decide whether a private next step is useful.
        This is a starting point for a conversation. Describe the problem in your own words; no ready-made package is assumed.
        Submitting this form does not start paid work, accept a contract, grant access, or authorize a production or external action.
  - type: input
    id: workflow
    attributes:
      label: One workflow
      description: Name the single source-to-target handoff that is unreliable.
      placeholder: "Example: agent-generated report entering an internal review queue"
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: What goes wrong?
      description: What repeatedly goes wrong, in sanitized terms?
      placeholder: "Missing output is sometimes treated as success, causing manual recovery."
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: A useful first check
      description: What observable result would make a small first step useful?
      placeholder: "Malformed and missing artifacts always enter an explicit held state in the test environment."
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Test environment available?
      options:
        - "Yes — sanitized test environment and examples"
        - "Partly — examples only"
        - "No — discovery and contract first"
    validations:
      required: true
  - type: dropdown
    id: discovery
    attributes:
      label: How did you find this project?
      description: This helps me understand where people find the project.
      options:
        - "GitHub profile"
        - "GitHub repository or release"
        - "Search"
        - "Referral or recommendation"
        - "Other public source"
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-data boundary
      options:
        - label: I confirm this issue contains no credentials, personal/customer data, private code, private URLs, or production access details.
          required: true
        - label: I understand that this public issue does not authorize paid work, production changes, credentials, or account access.
          required: true
